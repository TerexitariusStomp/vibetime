<!doctype html>
<!--
  The link-preview image for every vibetime.club page. Regenerate with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --window-size=1200,630 --screenshot=server/assets/og.png tools/og-card.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0a0a0a; color: #e5e5e5; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; padding: 72px 88px; display: flex; flex-direction: column; }
  .brand { color: #a78bfa; font-size: 34px; font-weight: 600; letter-spacing: 0.5px; display: flex; align-items: center; gap: 16px; }
  .brand svg { width: 30px; height: 30px; }
  h1 { font-size: 66px; font-weight: 500; line-height: 1.18; letter-spacing: -1px; margin-top: auto; max-width: 960px; }
  .places { color: #777; font-size: 28px; margin-top: 28px; }
  .places b { color: #a78bfa; font-weight: 400; }
  .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 28px; border-top: 1px solid #1a1a1a; font-size: 26px; }
  .url { color: #e5e5e5; }
  .cmd { color: #a78bfa; background: #15101f; padding: 8px 18px; border-radius: 10px; }
</style>
</head>
<body>
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4 60 32 32 60 4 32Z" fill="#7c3aed"/></svg>vibetime</div>
  <h1>track what you actually ship with AI.</h1>
  <p class="places">the weekly leaderboard <b>·</b> crews <b>·</b> stats</p>
  <div class="foot"><span class="url">vibetime.club</span><span class="cmd">npm i -g vibetime-cli</span></div>
</body>
</html>
